<text x="-453.6" y="308.8" text-anchor="start" font-size="13" fill="#16252e" >原点在 yaw 轴上、pitch 轴的高度（d1 = 0），Z 沿 yaw 轴；ψ=0 时姿态与 {B} 重合；绕 Z 正转（从上看逆时针）为 ψ>0</text>
<rect x="-629.6" y="329.8" width="16" height="4" fill="#7a4fb0"/>
<text x="-603.6" y="334.8" text-anchor="start" font-size="14" fill="#7a4fb0" font-weight="600">{J2} pitch 关节系</text>
<text x="-453.6" y="334.8" text-anchor="start" font-size="13" fill="#16252e" >DH 约定：原点在 pitch 轴上，Z 沿 pitch 转轴（=−Y_J1），X 沿连杆（枪管方向）；绕 Z 正转为抬头 θ>0</text>
<rect x="-629.6" y="355.8" width="16" height="4" fill="#d4521a"/>
<text x="-603.6" y="360.8" text-anchor="start" font-size="14" fill="#d4521a" font-weight="600">{G} 云台末端系</text>
<text x="-453.6" y="360.8" text-anchor="start" font-size="13" fill="#16252e" >原点在枪口，X 为视轴，Y 向左，Z 向上；与 {J2} 差一个固定旋转（X_G=X_J2，Y_G=−Z_J2，Z_G=Y_J2）</text>
<rect x="-629.6" y="381.8" width="16" height="4" fill="#2f8f3a"/>
<text x="-603.6" y="386.8" text-anchor="start" font-size="14" fill="#2f8f3a" font-weight="600">{T} 目标系</text>
<text x="-453.6" y="386.8" text-anchor="start" font-size="13" fill="#16252e" >X 轴为希望云台指向的方向；其 Y、Z（含 Roll）二轴云台无法控制</text>
<rect x="-629.6" y="407.8" width="16" height="4" fill="#c98a00"/>
<text x="-603.6" y="412.8" text-anchor="start" font-size="14" fill="#c98a00" font-weight="600">连杆 1</text>
<text x="-453.6" y="412.8" text-anchor="start" font-size="13" fill="#16252e" >Z_J1 与 Z_J2 的公垂线，沿 X_J1。pitch 轴在 yaw 轴后方 l，X_J1 取向前，所以 a1 = −l</text>
<rect x="-629.6" y="433.8" width="16" height="4" fill="#c2185b"/>
<text x="-603.6" y="438.8" text-anchor="start" font-size="14" fill="#c2185b" font-weight="600">连杆 2</text>
<text x="-453.6" y="438.8" text-anchor="start" font-size="13" fill="#16252e" >Z_J2 之后没有下一条关节轴，公垂线不存在；取沿 X_J2 从 pitch 轴到枪口的固定偏置，a2 = L</text>
<text x="-629.6" y="472.8" text-anchor="start" font-size="14" fill="#16252e" font-weight="600">DH 参数表（改进 DH，α(i−1), a(i−1), d(i), θ(i)）</text>
<text x="-617.6" y="496.8" text-anchor="start" font-size="13" fill="#16252e" xml:space="preserve">i=1:   0,     0,    0,   ψ</text>
<text x="-617.6" y="520.8" text-anchor="start" font-size="13" fill="#16252e" xml:space="preserve">i=2:   90°,   −l,   0,   θ</text>
<text x="-617.6" y="544.8" text-anchor="start" font-size="13" fill="#16252e" xml:space="preserve">i=3:   −90°,  L,    0,   0（固定变换，{J2}→{G}）</text>
<text x="-629.6" y="574.8" text-anchor="start" font-size="13" fill="#16252e" >R_G^B = Rz(ψ)·Ry(−θ)</text>
</svg>
